<!-- Botões de ação -->
<div class="action-buttons">
  <!-- Botão para alternar visualização -->
  <button type="button" class="action-btn toggle-view-btn" [class.active]="isViewMode" (click)="toggleView()"
    [attr.aria-label]="isViewMode ? 'Editar conteúdo' : 'Visualizar conteúdo'">
    @if(!isViewMode){
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" fill="none" stroke-width="2" />
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
      </svg>
    }
    @if(isViewMode){
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M17.94 17.94A10.94 10.94 0 0112 20C5 20 1 12 1 12a21.77 21.77 0 015.17-6.36M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a21.77 21.77 0 01-2.29 3.49M1 1l22 22"
          stroke="currentColor" fill="none" stroke-width="2" />
      </svg>
    }
  </button>

  <!-- Botão para limpar conteúdo -->
  <button type="button" class="action-btn clear-btn" 
  (click)="clearContent()" [attr.aria-label]="'Limpar conteúdo'"
    [disabled]="empty">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M3 6h18" stroke="currentColor" fill="none" stroke-width="2" />
      <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" stroke="currentColor"
        fill="none" stroke-width="2" />
      <path d="M10 11v6" stroke="currentColor" fill="none" stroke-width="2" />
      <path d="M14 11v6" stroke="currentColor" fill="none" stroke-width="2" />
    </svg>
  </button>
</div>


<div class="rich-text-dynamic-container" [class.error]="isInvalid">

  <div class="input-group" [class.focused]="focused" [class.has-value]="hasValue">
    <!-- Label com asterisco vermelho quando required -->
    <label [class.focused]="focused || !empty">
      {{ config.placeholder }}
      <span *ngIf="config.required !== false" class="required-asterisk">*</span>
    </label>

    <div class="input-icon">
      @if(showImage) {
      <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
        <line x1="16" y1="2" x2="22" y2="2" />
        <line x1="16" y1="7" x2="22" y2="7" />
        <line x1="16" y1="12" x2="22" y2="12" />
        <line x1="2" y1="17" x2="22" y2="17" />
        <line x1="2" y1="22" x2="22" y2="22" />
        <rect x="2" y="2" width="10" height="9" />
        <polyline points="2,11 6,7 9,9 12,7" />
        <circle cx="9" cy="5" r="1" />
      </svg>
      }
    </div>

    <!-- Wrapper principal -->
    <div class="quill-wrapper" [style.max-width]="'100%'">
      <!-- Editor -->
       @if(!isViewMode) {
        <div class="editor-container">
          <quill-editor class="quill-editor" [ngModel]="value" (ngModelChange)="onContentChange($event)"
            [modules]="quillModules" [placeholder]="config.placeholder" [styles]="editorStyles" [readOnly]="disabled"
            (onFocus)="onFocus()" (onBlur)="onBlur()" format="html">
          </quill-editor>
        </div>
      }
      <!-- Visualização -->
       @if(isViewMode) {
        <div *ngIf="isViewMode" class="rich-text-viewer" [innerHTML]="value"></div>
       }
    </div>
  </div>

  <div class="count-msg-error">
      <!-- Contador -->
      @if(showCount || showLimit) {
        <div class="character-counter">
          @if(showCount) { <span  class="character-count">{{ characterCount }} characters</span> }
          @if(showLimit) { 
          <span class="character-limit" [class.exceeded]="isLimitExceeded">
            / {{ limit }}
          </span> }

          @if(showLimit && isLimitExceeded) {
          <span class="limit-exceeded">
            ({{ characterCount - limit }} over)
          </span>
          }
        </div>
      }
      <!-- Mensagem de erro -->
    <span class="error-message" [class.show]="isInvalid && errorMessage">
      {{ errorMessage }}
    </span>
  </div>
</div>
