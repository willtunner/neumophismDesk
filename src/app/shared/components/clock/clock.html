<div class="clock-card neu-container">
  <!-- Seletor de tipo de relógio -->
  <div class="clock-toggle">
    <button 
      class="toggle-btn" 
      [class.active]="isAnalog()"
      (click)="toggleClockType()">
      {{ isAnalog() ? 'Analógico' : 'Digital' }}
    </button>
  </div>

  <!-- Relógio Analógico -->
  @if (isAnalog()) {
    <div class="analog-clock">
      <div class="clock-face">
        <!-- Marcadores de horas -->
        <span class="hour-marker text-1">3</span>
        <span class="hour-marker text-2">6</span>
        <span class="hour-marker text-3">9</span>
        <span class="hour-marker text-4">12</span>
        
        <!-- Marcadores de minutos -->
        <span class="minute-line" style="--deg: 30;"></span>
        <span class="minute-line" style="--deg: 60;"></span>
        <span class="minute-line" style="--deg: 120;"></span>
        <span class="minute-line" style="--deg: 150;"></span>
        <span class="minute-line" style="--deg: 210;"></span>
        <span class="minute-line" style="--deg: 240;"></span>
        <span class="minute-line" style="--deg: 300;"></span>
        <span class="minute-line" style="--deg: 330;"></span>
        
        <!-- Centro do relógio -->
        <div class="clock-center"></div>
        
        <!-- Ponteiros -->
        <div class="needle hours-needle"></div>
        <div class="needle minutes-needle"></div>
        <div class="needle seconds-needle"></div>
      </div>
    </div>
  }

  <!-- Relógio Digital -->
  @if (!isAnalog()) {
    <div class="digital-clock">
      <div class="time-display">
        <span class="time">{{ currentTime() }}</span>
        <span class="time-format">{{ timeFormat() }}</span>
      </div>
      <div class="date">{{ currentDate() }}</div>
    </div>
  }
</div>
