<div class="neu-table-container neu-scrollbar-small">
  <table class="neu-table">
    <thead>
      <tr>
        <th *ngFor="let header of headers" matTooltip="{{ header.label | translate }}" matTooltipPosition="above">
          {{ header.label | translate }}
        </th>
        <th>{{ 'TABLE.ACTIONS' | translate }}</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of data" 
          class="table-row" 
          [class.selected]="isRowSelected(item)"
          (click)="onRowClick(item)">
        
        <!-- Para cada coluna -->
        <td *ngFor="let header of headers">
          <ng-container *ngIf="getNestedValue(item, header.field) as cellValue">
            
            <!-- Verifica se é FirestoreTimestamp -->
            <ng-container *ngIf="isFirestoreTimestamp(cellValue); else checkDate">
              {{ cellValue | firestoreRelativeTime : translate.currentLang }}
            </ng-container>
            
            <!-- Verifica se é Date normal -->
            <ng-template #checkDate>
              <ng-container *ngIf="isDate(cellValue); else normalText">
                {{ cellValue | dateOnlyFormat }}
              </ng-container>
            </ng-template>
            
            <!-- Mostra o texto normal -->
            <ng-template #normalText>
              <span [matTooltip]="cellValue" matTooltipPosition="above">
                {{ cellValue }}
              </span>
            </ng-template>
            
          </ng-container>
        </td>

        <!-- Coluna de ações -->
        <td class="actions" (click)="$event.stopPropagation()">
          <button class="neu-btn edit" (click)="onEdit(item)">
            <i class="material-icons">edit</i>
          </button>
          <button class="neu-btn delete" (click)="onRemove(item)">
            <i class="material-icons">delete</i>
          </button>
        </td>
      </tr>

      <!-- Linha vazia -->
      <tr *ngIf="!data || data.length === 0">
        <td [attr.colspan]="headers.length + 1" class="empty-state">
          {{ 'CLIENTS.FIELDS.NO_DATA' | translate }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
