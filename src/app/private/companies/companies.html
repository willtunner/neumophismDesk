<div class="page-container">
    <!-- Container Principal -->
    <div class="neu-container companies-container">

        <!-- Seção de Filtros -->
        <div class="filters-section neu-emboss">
            <h3>{{ 'COMPANIES.FILTERS.TITLE' | translate }}</h3>

            <div class="filters-container" *ngIf="isConfigsReady">
                <div class="filters-grid">
                    <!-- Primeira Linha: Dois inputs -->
                    <div class="filter-row">
                        <!-- Campo de Busca -->
                        <div class="filter-field">
                            <label class="filter-label">{{ 'COMPANIES.FILTERS.SEARCH' | translate }}</label>
                            <app-input-dynamic [config]="inputConfigs.search" [control]="searchControl" [showImage]="true">
                            </app-input-dynamic>
                        </div>

                        <!-- Campo para Selecionar Filtro -->
                        <div class="filter-field">
                            <label class="filter-label">{{ 'COMPANIES.FILTERS.FILTER_BY' | translate }}</label>
                            <app-select-dynamic [config]="selectConfigs.filterField" [control]="filterFieldControl"
                                [showImage]="false">
                            </app-select-dynamic>
                        </div>
                    </div>

                    <!-- Segunda Linha: Datas -->
                    <div class="filter-row">
                        <div class="filter-field date-range">
                            <label class="filter-label">{{ 'COMPANIES.FILTERS.DATE_RANGE' | translate }}</label>
                            <div class="date-inputs">
                                <div class="date-field">
                                    <label class="date-label">{{ 'COMPANIES.FILTERS.START_DATE' | translate }}</label>
                                    <input type="date" [formControl]="startDateControl" class="neu-input date-input">
                                </div>
                                <div class="date-field">
                                    <label class="date-label">{{ 'COMPANIES.FILTERS.END_DATE' | translate }}</label>
                                    <input type="date" [formControl]="endDateControl" class="neu-input date-input">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Terceira Linha: Botão -->
                    <div class="filter-row">
                        <div class="filter-actions">
                            <button type="button" class="neu-button secondary clear-button" (click)="onClearFilters()">
                                {{ 'COMPANIES.FILTERS.CLEAR' | translate }}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulário da Empresa -->
        <div class="form-section neu-emboss">
            <h3>{{ (isEditing ? 'COMPANIES.EDIT_TITLE' : 'COMPANIES.CREATE_TITLE') | translate }}</h3>

            <form *ngIf="isConfigsReady" [formGroup]="companyForm" (ngSubmit)="onSubmit()">

                <div class="form-grid">
                    <!-- Nome -->
                    <div class="form-group">
                        <app-input-dynamic [config]="inputConfigs.name" [control]="nameControl" [showImage]="true">
                        </app-input-dynamic>
                    </div>

                    <!-- CNPJ -->
                    <div class="form-group">
                        <app-input-dynamic [config]="inputConfigs.cnpj" [control]="cnpjControl" [showImage]="true">
                        </app-input-dynamic>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <app-input-dynamic [config]="inputConfigs.email" [control]="emailControl" [showImage]="true">
                        </app-input-dynamic>
                    </div>

                    <!-- Telefone -->
                    <div class="form-group">
                        <app-input-dynamic [config]="inputConfigs.phone" [control]="phoneControl" [showImage]="true">
                        </app-input-dynamic>
                    </div>

                    <!-- Endereço (ocupa 2 colunas) -->
                    <div class="form-group" style="grid-column: span 2;">
                        <app-input-dynamic [config]="inputConfigs.address" [control]="addressControl"
                            [showImage]="true">
                        </app-input-dynamic>
                    </div>

                    <!-- Cidade -->
                    <div class="form-group">
                        <app-input-dynamic [config]="inputConfigs.city" [control]="cityControl" [showImage]="true">
                        </app-input-dynamic>
                    </div>

                    <!-- Estado -->
                    <div class="form-group">
                        <app-select-dynamic [config]="selectConfigs.state" [control]="stateControl" [showImage]="false">
                        </app-select-dynamic>
                    </div>

                    <!-- CEP -->
                    <div class="form-group">
                        <app-input-dynamic [config]="inputConfigs.zipcode" [control]="zipcodeControl"
                            [showImage]="true">
                        </app-input-dynamic>
                    </div>

                    <!-- Conexão -->
                    <div class="form-group">
                        <app-input-dynamic [config]="inputConfigs.connectionServ" [control]="connectionServControl"
                            [showImage]="true">
                        </app-input-dynamic>
                    </div>

                    <!-- Versão -->
                    <div class="form-group">
                        <app-input-dynamic [config]="inputConfigs.versionServ" [control]="versionServControl"
                            [showImage]="true">
                        </app-input-dynamic>
                    </div>

                    <!-- Ações do Formulário -->
                    <div class="form-actions">
                        <button type="button" class="neu-button secondary" (click)="onNewCompany()" *ngIf="isEditing">
                            {{ 'COMPANIES.ACTIONS.NEW' | translate }}
                        </button>
                        <button type="submit" class="neu-button primary">
                            {{ (isEditing ? 'COMPANIES.ACTIONS.UPDATE' : 'COMPANIES.ACTIONS.SAVE') | translate }}
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Lista de Empresas -->
        <div class="list-section neu-emboss">
            <h3>{{ 'COMPANIES.LIST.TITLE' | translate }} ({{ filteredCompanies().length }})</h3>

            <div class="companies-list" *ngIf="!isLoading; else loadingTemplate">
                <app-dynamic-table
                  [headers]="tableHeaders"
                  [data]="filteredCompanies()"
                  [selectedRow]="selectedCompany()"
                  (edit)="onEditCompany($event)"
                  (remove)="onDeleteCompany($event)"
                  (rowClick)="onTableRowClick($event)"
                  (selectedRowChange)="onSelectedRowChange($event)">
                </app-dynamic-table>
            </div>

            <ng-template #loadingTemplate>
                <div class="loading-state">
                    {{ 'COMPANIES.LIST.LOADING' | translate }}
                </div>
            </ng-template>
        </div>
    </div>
</div>
