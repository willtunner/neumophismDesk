<div class="neu-modal-content neu-scrollbar-small">
  <div class="modal-header">
    <div class="modal-title neu-emboss">
      {{ 'MODALS.NEW_CLIENT' | translate }}
    </div>

    <button class="neu-button icon close" mat-dialog-close>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="4">
        <line x1="15" y1="5" x2="5" y2="15"></line>
        <line x1="5" y1="5" x2="15" y2="15"></line>
      </svg>
    </button>
  </div>

  <form [formGroup]="clientForm" (ngSubmit)="onSave()" class="modal-body">
    <app-input-dynamic [config]="usernameConfig" [control]="getControl('username')" [submitted]="submitted"></app-input-dynamic>
    <app-input-dynamic [config]="nameConfig" [control]="getControl('name')" [submitted]="submitted"></app-input-dynamic>
    <app-input-dynamic [config]="phoneConfig" [control]="getControl('phone')" [submitted]="submitted"></app-input-dynamic>
    <app-input-dynamic [config]="emailConfig" [control]="getControl('email')" [submitted]="submitted"></app-input-dynamic>
    <app-input-dynamic [config]="passwordConfig" [control]="getControl('password')" [submitted]="submitted"></app-input-dynamic>
    <app-input-dynamic [config]="imageUrlConfig" [control]="getControl('imageUrl')" [submitted]="submitted"></app-input-dynamic>
    <app-input-dynamic [config]="connectionConfig" [control]="getControl('connection')" [submitted]="submitted"></app-input-dynamic>


    <div class="modal-actions">
      <button type="button" class="neu-button secondary" (click)="onCancel()">
        {{ 'COMMON.CANCEL' | translate }}
      </button>
      <button type="submit" class="neu-button primary" >
        {{ 'COMMON.SAVE' | translate }}
      </button>
    </div>
  </form>
</div>
