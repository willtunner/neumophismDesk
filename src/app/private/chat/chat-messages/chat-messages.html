<div class="chat-messages neu-container">
  <!-- Cabeçalho -->
  <div class="chat-header neu-emboss">
    <div class="chat-title neu-emboss">Conversação Ativa</div>
  </div>

  <!-- Corpo do chat -->
  <div class="messages-area neu-scrollbar-small ">
    <div
      *ngFor="let msg of messages"
      class="message"
      [ngClass]="{ 'sent': msg.sender === 'client', 'received': msg.sender === 'operator' }"
    >
      <div class="message-content">
        <div class="message-text">{{ msg.text }}</div>
        <div class="message-time">{{ msg.time }}</div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="message-input">
    <input
      type="text"
      placeholder="Digite sua mensagem..."
      [(ngModel)]="newMessage"
      class="neu-input"
      (keydown.enter)="sendMessage()"
    />
    <button class="neu-button primary" (click)="sendMessage()">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          d="M3 12l18-9-7 9 7 9-18-9z"
        />
      </svg>
    </button>
  </div>
</div>
