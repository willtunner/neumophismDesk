<div class="client-card neu-container">
  <!-- Cabeçalho -->
  <div
    class="client-header"
    [ngStyle]="{ 'background': client.status ? '#2ecc71' : '#e74c3c' }"
  >
    <span>Cliente</span>
  </div>

  <!-- Conteúdo -->
  <div class="client-content">
    <div class="profile-wrapper">
      <img [src]="client.foto" alt="Foto do cliente" class="profile-image" />
      <span
        class="status-dot"
        [ngStyle]="{ 'background-color': client.status ? '#2ecc71' : '#e74c3c' }"
      ></span>
    </div>

    <div class="client-info">
      <h3>{{ client.nome }}</h3>
      <p>{{ client.empresa }}</p>
      <small>{{ client.cnpj }}</small>
    </div>

    <h2 class="highlight-text">Diferença de caixa</h2>

    <button
      class="btn-end"
      [ngStyle]="{ 'background': client.status ? '#2ecc71' : '#e74c3c' }"
      (click)="toggleStatus()"
    >
      {{ client.status ? 'Sair' : 'Entrar' }}
    </button>
  </div>
</div>
