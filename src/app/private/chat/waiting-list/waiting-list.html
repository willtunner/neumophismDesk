<div class="waiting-card neu-container-no-padding">
  <!-- Cabeçalho -->
  <div class="waiting-header neu-emboss">
    <div class="chat-title neu-emboss">Atendimentos</div>
  </div>


  <!-- Conteúdo -->
  <div class="waiting-content">
    <table mat-table [dataSource]="waitingList" class="mat-elevation-z0 waiting-table">

      <!-- Nome -->
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let item"> {{ item.nome }} </td>
      </ng-container>

      <!-- Empresa -->
      <ng-container matColumnDef="empresa">
        <th mat-header-cell *matHeaderCellDef> Empresa </th>
        <td mat-cell *matCellDef="let item"> {{ item.empresa }} </td>
      </ng-container>

      <!-- Assunto -->
      <ng-container matColumnDef="assunto">
        <th mat-header-cell *matHeaderCellDef> Assunto </th>
        <td mat-cell *matCellDef="let item"> {{ item.assunto }} </td>
      </ng-container>

      <!-- Tempo -->
      <ng-container matColumnDef="tempo">
        <th mat-header-cell *matHeaderCellDef> Tempo </th>
        <td mat-cell *matCellDef="let item"> {{ item.tempo }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <!-- Infos abaixo da tabela -->
    <div class="footer-info">
      <div class="chat-title neu-emboss" style="width: 115px !important;">
        <p>Na fila: <span class="highlight">{{ waitingList.length }}</span></p>
      </div>

      <div class="chat-title neu-emboss" style="padding-left: 5px;padding-right: 5px; width: 180px;">
        <p>Operadores livres: <span class="highlight-red">{{ operadoresLivres }}</span></p>
      </div>
    </div>
  </div>
</div>
